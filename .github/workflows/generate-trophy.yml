name: Generate Trophy

on:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03:00 UTC (~00:00 horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba "Actions"
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-trophy.yml"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar o SVG do troféu
        run: |
          curl -fsSL --retry 3 --retry-all-errors \
            "https://github-profile-trophy.vercel.app/?username=sleeperCoderZzZ&theme=default" \
            -o trophy.svg

      - name: Commitar e enviar o trophy.svg atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: atualizar trophy.svg"
          git push
